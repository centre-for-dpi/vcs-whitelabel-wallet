name: Compilar iOS (React Native)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de JavaScript
        run: npm install

      # expo-dev-client trae pods con xcassets que referencian iOS 15.2 simulator,
      # que no existe en el runner macos-15. Se elimina la referencia del plugin
      # en app.json Y se desinstala el paquete para que auto-linking tampoco lo
      # incluya. El JS del paquete no es necesario en builds de Release.
      - name: Excluir expo-dev-client del build de Release
        run: |
          sed -i '' '/"expo-dev-client"/d' app.json
          npm uninstall expo-dev-client

      # --no-install evita que expo prebuild corra pod install internamente;
      # lo corremos nosotros en el paso siguiente para aprovechar el cache.
      - name: Generar carpeta iOS nativa (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # Cache de CocoaPods: evita re-descargar specs en cada build
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-

      - name: Instalar CocoaPods
        run: |
          gem install cocoapods --no-document
          cd ios && pod install

      # El runner tiene el SDK (iphoneos18.2) pero no los archivos de soporte de
      # plataforma requeridos por -destination generic/platform=iOS. Esta descarga
      # los instala (~2-5 min, solo en cache miss).
      #
      # El comando falla de forma intermitente con "Unable to connect to
      # simulator" (exit 70) por un problema de infraestructura del runner, no
      # del proyecto: ocurrió tanto en el commit limpio 5030215 (run 32210776713)
      # como en run 32271554178, y en ambos casos abortó el workflow ANTES de
      # llegar a compilar. Se reintenta y, si aun así falla, se continúa: los
      # archivos de plataforma suelen estar ya presentes, y si de verdad
      # faltaran, el paso "Compilar Aplicación" fallará con un error explícito
      # en vez de enmascarar el problema aquí.
      - name: Descargar plataforma iOS
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "::group::Intento $attempt de xcodebuild -downloadPlatform iOS"
            if xcodebuild -downloadPlatform iOS; then
              echo "::endgroup::"
              echo "Plataforma iOS lista (intento $attempt)."
              exit 0
            fi
            echo "::endgroup::"
            echo "Intento $attempt falló; reintentando en 30s..."
            sleep 30
          done
          echo "No se pudo descargar la plataforma iOS tras 3 intentos."
          echo "Se continúa: 'Compilar Aplicación' fallará explícitamente si faltan."

      - name: Compilar Aplicación
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Empaquetar en formato .ipa
        run: |
          APP=$(find ios/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "App encontrada: $APP"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build
          zip -r cdpiwallet.ipa Payload

      - name: Subir archivo final a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-release
          path: build/cdpiwallet.ipa
