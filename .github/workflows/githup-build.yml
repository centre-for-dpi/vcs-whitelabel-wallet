name: Compilar iOS (React Native)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de JavaScript
        run: npm install

      # expo-dev-client trae pods con xcassets que referencian iOS 15.2 simulator,
      # que no existe en el runner macos-15. Se elimina la referencia del plugin
      # en app.json Y se desinstala el paquete para que auto-linking tampoco lo
      # incluya. El JS del paquete no es necesario en builds de Release.
      - name: Excluir expo-dev-client del build de Release
        run: |
          sed -i '' '/"expo-dev-client"/d' app.json
          npm uninstall expo-dev-client

      # --no-install evita que expo prebuild corra pod install internamente;
      # lo corremos nosotros en el paso siguiente para aprovechar el cache.
      - name: Generar carpeta iOS nativa (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      # TEMP DEBUG — remove once the MdocDataTransfer autolinking gap is diagnosed.
      - name: "[DEBUG] Inspeccionar autolinking y Podfile generado"
        run: |
          echo "--- expo-mdoc-data-transfer instalado? ---"
          ls -la node_modules/expo-mdoc-data-transfer || echo "NOT FOUND in node_modules"
          echo "--- autolinking resolve (ios) full entry ---"
          npx expo-modules-autolinking resolve --platform ios --json | python3 -c "
import json,sys
d=json.load(sys.stdin)
for m in d.get('modules', []):
    if 'mdoc' in str(m.get('packageName', m.get('name',''))).lower():
        print(json.dumps(m, indent=2))
"
          echo "--- full Podfile ---"
          cat ios/Podfile

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # Cache de CocoaPods: evita re-descargar specs en cada build
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-

      - name: Instalar CocoaPods
        run: |
          gem install cocoapods --no-document
          cd ios && pod install --verbose 2>&1 | grep -B5 -A5 -i "mdoc\|MdocDataTransfer" || true
          pod install

      # El runner tiene el SDK (iphoneos18.2) pero no los archivos de soporte de
      # plataforma requeridos por -destination generic/platform=iOS. Esta descarga
      # los instala (~2-5 min, solo en cache miss).
      - name: Descargar plataforma iOS
        run: xcodebuild -downloadPlatform iOS

      - name: Compilar Aplicación
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Empaquetar en formato .ipa
        run: |
          APP=$(find ios/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "App encontrada: $APP"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build
          zip -r cdpiwallet.ipa Payload

      - name: Subir archivo final a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-release
          path: build/cdpiwallet.ipa
