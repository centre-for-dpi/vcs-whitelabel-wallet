name: Compilar iOS (React Native)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de JavaScript
        run: npm install

      - name: Generar carpeta iOS nativa (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      # ruby/setup-ruby con bundler-cache usa el Gemfile que genera expo prebuild en ios/
      - name: Configurar Ruby y Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Instalar CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Compilar Aplicación
        run: |
          WORKSPACE=$(ls ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Empaquetar en formato .ipa
        run: |
          APP=$(find ios/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "App encontrada: $APP"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build
          zip -r cdpiwallet.ipa Payload

      - name: Subir archivo final a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-release
          path: build/cdpiwallet.ipa
